<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>drift</title><style>
*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:system-ui,sans-serif;color:#fff}
#title{position:absolute;top:38%;width:100%;text-align:center;font-size:3rem;font-weight:200;letter-spacing:.3em;opacity:1}
#sub{position:absolute;top:48%;width:100%;text-align:center;font-size:.9rem;font-weight:300;letter-spacing:.15em;opacity:.5;animation:pulse 2s ease-in-out infinite}
#score{position:absolute;top:6%;right:6%;font-size:2rem;font-family:monospace;opacity:0;font-weight:200}
#death{position:absolute;top:42%;width:100%;text-align:center;font-size:1.5rem;font-weight:300;letter-spacing:.1em;opacity:0}
#footer{position:absolute;bottom:3%;width:100%;text-align:center;font-size:.7rem;opacity:.4}
#footer a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.7}}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">drift</div><div id="sub">tap to play</div>
  <div id="score">0</div><div id="death"></div>
  <div id="footer">Made with care by <a href="https://william.revah.paris" target="_blank">William</a></div>
</div>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl2');
const titleEl=document.getElementById('title'),subEl=document.getElementById('sub');
const scoreEl=document.getElementById('score'),deathEl=document.getElementById('death'),footerEl=document.getElementById('footer');

// --- Shaders ---
const VS=`#version 300 es
in vec2 p;out vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0,1);}`;

const FS=`#version 300 es
precision highp float;in vec2 vUv;out vec4 O;
uniform vec2 uR;uniform float uTime,uBirdY,uScroll,uFlash;uniform vec3 uP[8];

float sdSphere(vec3 p,float r){return length(p)-r;}
float sdBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}

float pillars(vec3 p){float d=1e9;
  for(int i=0;i<8;i++){float px=uP[i].x-uScroll,gy=uP[i].y,gs=uP[i].z;
    d=min(d,sdBox(p-vec3(px,gy+gs*.5+5.,0),vec3(.3,5.,.3),.1));
    d=min(d,sdBox(p-vec3(px,gy-gs*.5-5.,0),vec3(.3,5.,.3),.1));}return d;}

vec3 march(vec3 ro,vec3 rd){float t=0.,mO=1e9,mP=1e9,mT=1e9;
  vec3 orbPos=vec3(-3.,uBirdY,0.);
  for(int i=0;i<64;i++){vec3 p=ro+rd*t;
    float dO=sdSphere(p-orbPos,.3);
    float dT=sdSphere((p-orbPos+vec3(.6,0,0))*vec3(.4,1,1),.2);
    float dP=pillars(p);float d=min(min(dO,dP),dT);
    mO=min(mO,dO);mP=min(mP,dP);mT=min(mT,dT);
    if(d<.001||t>30.)break;t+=d;}return vec3(t,mO,mP);}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uR)/uR.y;
  // Void gradient
  vec3 col=mix(vec3(.024,.039,.031),vec3(.055,.078,.063),vUv.y);
  col+=.012*exp(-3.*length(vUv-.5));
  // Raymarch
  vec3 ro=vec3(0,0,-10),rd=normalize(vec3(uv,1.2));
  vec3 h=march(ro,rd);float fog=exp(-.06*h.x);
  // Pillar glow + surface
  col+=vec3(.12,.35,.2)*.008/(h.z*h.z+.005)*fog;
  if(h.z<.001)col=vec3(.1,.3,.15)*fog;
  // Orb glow + surface + trail
  col+=vec3(1.,.88,.65)*.015/(h.y*h.y+.01)*fog;
  if(h.y<.001)col=vec3(1.,.9,.7);
  // Death flash
  col=mix(col,vec3(1.),uFlash*.6);
  O=vec4(col,1);}`;

// --- WebGL setup ---
function compile(src,type){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const prog=gl.createProgram();
gl.attachShader(prog,compile(VS,gl.VERTEX_SHADER));
gl.attachShader(prog,compile(FS,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pLoc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(prog,'uR'),uTime=gl.getUniformLocation(prog,'uTime');
const uBirdY=gl.getUniformLocation(prog,'uBirdY'),uScroll=gl.getUniformLocation(prog,'uScroll');
const uFlash=gl.getUniformLocation(prog,'uFlash'),uP=gl.getUniformLocation(prog,'uP');

// --- Game state ---
let state='ready',birdY=0,velY=0,scroll=0,score=0,elapsed=0,flash=0;
let best=+localStorage.getItem('drift-best')||0;
const P=Array.from({length:8},(_,i)=>[i*6,(Math.random()-.5)*3,3]);

function reset(){state='ready';birdY=0;velY=0;scroll=0;score=0;elapsed=0;flash=0;
  P.forEach((p,i)=>{p[0]=i*6;p[1]=(Math.random()-.5)*3;p[2]=3;});}

function die(){state='dead';flash=1;
  if(score>best){best=score;localStorage.setItem('drift-best',best);}playDeath();}

// --- Input ---
const tap=()=>{
  if(state==='ready'){state='playing';elapsed=0;velY=7;startAudio();}
  else if(state==='playing'){velY=7;playTap();}
  else if(state==='dead'){reset();}};
document.addEventListener('click',tap);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap();}});
document.addEventListener('touchstart',e=>{e.preventDefault();tap();},{passive:false});

// --- Audio ---
let actx,droneGain,tensionGain;
function startAudio(){if(actx)return;actx=new AudioContext();
  droneGain=actx.createGain();droneGain.gain.value=.06;droneGain.connect(actx.destination);
  const d1=actx.createOscillator();d1.frequency.value=55;d1.connect(droneGain);d1.start();
  const d2=actx.createOscillator();d2.frequency.value=55.5;d2.connect(droneGain);d2.start();
  tensionGain=actx.createGain();tensionGain.gain.value=0;tensionGain.connect(actx.destination);
  const d3=actx.createOscillator();d3.frequency.value=110;d3.connect(tensionGain);d3.start();}

function playTap(){if(!actx)return;const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  f.type='lowpass';f.frequency.value=800;
  o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(150,t+.05);
  g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);
  o.connect(f);f.connect(g);g.connect(actx.destination);o.start();o.stop(t+.08);}

function playDeath(){if(!actx)return;const t=actx.currentTime;
  droneGain.gain.setValueAtTime(0,t);
  const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=40;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(t+.1);
  droneGain.gain.setValueAtTime(0,t+.2);droneGain.gain.linearRampToValueAtTime(.06,t+.5);}

// --- Render loop ---
let prev=0;
function resize(){c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height);}
addEventListener('resize',resize);resize();

(function frame(now){requestAnimationFrame(frame);
  const dt=Math.min((now-prev)/1000,.05);prev=now;

  // Physics
  if(state==='playing'){
    velY-=20*dt;birdY+=velY*dt;
    const speed=3*(1+elapsed*.002);scroll+=speed*dt;elapsed+=dt;
    score=Math.floor(scroll);
    // Collision
    for(const p of P){const dx=p[0]-scroll+3;
      if(Math.abs(dx)<.6){if(Math.abs(birdY-p[1])+.3>p[2]*.5){die();break;}}}
    if(birdY<-5||birdY>5)die();
    // Recycle pillars
    for(const p of P){if(p[0]-scroll<-10){
      let mx=0;for(const q of P)if(q[0]>mx)mx=q[0];
      p[0]=mx+6;p[1]=(Math.random()-.5)*3;p[2]=Math.max(2.2,3-elapsed*.0067);}}
    // Tension audio
    if(actx)tensionGain.gain.value=Math.min(elapsed/90,1)*.03;
  }
  flash*=.85;

  // Uniforms
  const pFlat=new Float32Array(24);P.forEach((p,i)=>{pFlat[i*3]=p[0];pFlat[i*3+1]=p[1];pFlat[i*3+2]=p[2];});
  gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uTime,now*.001);
  gl.uniform1f(uBirdY,birdY);gl.uniform1f(uScroll,scroll);gl.uniform1f(uFlash,flash);
  gl.uniform3fv(uP,pFlat);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  // UI
  scoreEl.textContent=score;scoreEl.style.opacity=state==='playing'?'.6':'0';
  titleEl.style.opacity=state==='ready'?'1':'0';subEl.style.opacity=state==='ready'?'1':'0';
  footerEl.style.opacity=state==='ready'?'.4':'0';
  deathEl.textContent=score+' / best '+best;deathEl.style.opacity=state==='dead'?'1':'0';
})(0);
</script></body></html>
